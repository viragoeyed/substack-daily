<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8pm substack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk-top:#E7E1F2; --dusk-mid:#C9BEE0; --dusk-low:#9683B3;
    --night:#453A5C; --moon:#C9B87E; --cream:#FBF9F5; --ink:#3F3650; --ink-soft:#847A96;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:24px 14px;background:#F3EFF8;font-family:'DM Sans',sans-serif;color:var(--ink);}
  .card{max-width:700px;margin:0 auto;background:linear-gradient(180deg,var(--dusk-top) 0%,var(--dusk-mid) 60%,var(--dusk-low) 100%);
    border:1px dashed var(--night);border-radius:22px;padding:32px 28px 26px;}
  .eyebrow{font-size:12.5px;color:var(--night);opacity:.75;letter-spacing:.03em;margin:0 0 2px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:30px;margin:0 0 4px;color:var(--night);}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--night);opacity:.8;margin:0 0 20px;}
  .today{background:rgba(251,249,245,.9);border:1px dashed var(--moon);border-radius:16px;padding:16px 18px;margin-bottom:18px;}
  .today-label{font-size:12.5px;color:var(--ink-soft);margin:0 0 6px;}
  .pick{padding:10px 0;border-top:1px dashed rgba(69,58,92,.2);}
  .pick:first-of-type{border-top:none;}
  .pick-title{font-family:'Fraunces',serif;font-size:17px;margin:0 0 2px;color:var(--night);}
  .pick-meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 3px;}
  .pick-hook{font-size:13px;margin:0;line-height:1.45;}
  .progress{display:flex;align-items:center;gap:10px;background:rgba(251,249,245,.8);border:1px dashed var(--moon);border-radius:14px;padding:11px 16px;margin-bottom:16px;}
  .bar{flex:1;height:8px;border-radius:999px;background:rgba(69,58,92,.12);overflow:hidden;}
  .fill{height:100%;width:0;background:var(--moon);transition:width .3s ease;}
  .plabel{font-size:13px;color:var(--night);}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px dashed var(--night);color:var(--night);cursor:pointer;user-select:none;}
  .chip.on{background:var(--night);color:#fff;border-style:solid;}
  .toggles{display:flex;gap:14px;margin:0 0 14px;font-size:12.5px;color:var(--night);}
  .tg{cursor:pointer;user-select:none;}
  .row{display:flex;gap:12px;align-items:flex-start;background:rgba(251,249,245,.86);border:1px dashed rgba(69,58,92,.28);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .row.done{background:rgba(150,131,179,.28);border-color:var(--dusk-low);}
  .check{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dusk-low);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff;cursor:pointer;}
  .row.done .check{background:var(--dusk-low);}
  .body{flex:1;min-width:0;}
  .title{font-family:'Fraunces',serif;font-size:15.5px;margin:0 0 2px;color:var(--night);line-height:1.35;}
  .row.done .title{text-decoration:line-through;text-decoration-color:rgba(69,58,92,.4);}
  .meta{font-size:12px;color:var(--ink-soft);margin:0 0 3px;}
  .hook{font-size:12.5px;margin:0;line-height:1.45;}
  .paid{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px dashed var(--ink-soft);color:var(--ink-soft);margin-left:6px;vertical-align:1px;}
  .actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:none;}
  .star{cursor:pointer;font-size:17px;color:#BDB2CC;user-select:none;line-height:1;}
  .star.on{color:#C9A83E;}
  a.open{font-size:12px;color:var(--night);text-decoration:none;border-bottom:1px dashed var(--night);white-space:nowrap;}
  .note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.55;}
  .msg{font-size:14px;color:var(--night);}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow" id="dateLine">the 8 o'clock slot</p>
  <h1>substack, daily</h1>
  <p class="sub">fresh from your subscriptions each morning. two a night is plenty.</p>

  <div class="today">
    <p class="today-label">today's two</p>
    <div id="picks"><p class="msg">loading...</p></div>
  </div>

  <div class="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="plabel" id="plabel"></span>
  </div>

  <div class="filters" id="filters"></div>
  <div class="toggles">
    <span class="tg" id="tgFree"></span>
    <span class="tg" id="tgHide"></span>
  </div>
  <div id="list"></div>

  <p class="note" id="note"></p>
</div>

<script>
const KEY = 'substackDailyState';
let state = {read:{}, keep:{}, freeOnly:true, hideRead:false};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

let items = [], filter = 'all';
const $ = function(id){ return document.getElementById(id); };

function fmt(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
}
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// seeded shuffle so the same two show all day
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);} return h>>>0; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }

function todaysTwo(){
  const today = new Date().toLocaleDateString('en-CA');
  const rnd = mulberry(hash(today));
  let pool = items.filter(function(it){ return !state.read[it.link] && !(state.freeOnly && it.paid); });
  pool = pool.map(function(it){ return {it:it, r:rnd()}; }).sort(function(a,b){ return a.r-b.r; }).map(function(x){ return x.it; });
  if (!pool.length) return [];
  const first = pool[0];
  const second = pool.slice(1).find(function(it){ return it.source !== first.source; }) || pool[1];
  return second ? [first, second] : [first];
}

function pickHtml(it){
  return '<div class="pick"><p class="pick-title">' + esc(it.title) + (it.paid ? '<span class="paid">paid?</span>' : '') + '</p>' +
    '<p class="pick-meta">' + esc(it.source) + ' · ' + fmt(it.date) + ' · <a class="open" href="' + it.link + '" target="_blank" rel="noopener">open</a></p>' +
    (it.snippet ? '<p class="pick-hook">' + esc(it.snippet) + '</p>' : '') + '</div>';
}

function render(){
  const picks = todaysTwo();
  $('picks').innerHTML = picks.length ? picks.map(pickHtml).join('') : '<p class="msg">nothing unread with these settings. turn off "free only", or rest.</p>';

  $('tgFree').textContent = 'free only: ' + (state.freeOnly ? 'on' : 'off');
  $('tgHide').textContent = 'hide read: ' + (state.hideRead ? 'on' : 'off');

  const list = $('list'); list.innerHTML = '';
  items.forEach(function(it){
    if (filter !== 'all' && it.source !== filter) return;
    if (state.freeOnly && it.paid) return;
    const done = !!state.read[it.link];
    if (state.hideRead && done) return;
    const row = document.createElement('div');
    row.className = 'row' + (done ? ' done' : '');
    row.innerHTML = '<div class="check">' + (done ? '✓' : '') + '</div>' +
      '<div class="body"><p class="title">' + esc(it.title) + (it.paid ? '<span class="paid">paid?</span>' : '') + '</p>' +
      '<p class="meta">' + esc(it.source) + ' · ' + fmt(it.date) + '</p>' +
      (it.snippet ? '<p class="hook">' + esc(it.snippet) + '</p>' : '') + '</div>' +
      '<div class="actions"><span class="star' + (state.keep[it.link] ? ' on' : '') + '">' + (state.keep[it.link] ? '★' : '☆') + '</span>' +
      '<a class="open" href="' + it.link + '" target="_blank" rel="noopener">open</a></div>';
    row.querySelector('.check').addEventListener('click', function(){ state.read[it.link] = !state.read[it.link]; save(); render(); });
    row.querySelector('.star').addEventListener('click', function(){ state.keep[it.link] = !state.keep[it.link]; save(); render(); });
    list.appendChild(row);
  });

  const read = items.filter(function(i){ return state.read[i.link]; }).length;
  $('plabel').textContent = read + ' of ' + items.length + ' read';
  $('fill').style.width = (items.length ? read / items.length * 100 : 0) + '%';
}

function buildFilters(){
  const names = ['all'].concat(Array.from(new Set(items.map(function(i){ return i.source; }))));
  const f = $('filters'); f.innerHTML = '';
  names.forEach(function(n){
    const c = document.createElement('span');
    c.className = 'chip' + (n === filter ? ' on' : '');
    c.textContent = n;
    c.addEventListener('click', function(){ filter = n; buildFilters(); render(); });
    f.appendChild(c);
  });
}

$('tgFree').addEventListener('click', function(){ state.freeOnly = !state.freeOnly; save(); render(); });
$('tgHide').addEventListener('click', function(){ state.hideRead = !state.hideRead; save(); render(); });

$('dateLine').textContent = new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'});

fetch('data.json?v=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){
    items = d.items || [];
    $('note').innerHTML = 'last refreshed ' + fmt(d.updated) + '. "paid?" is a best guess from the feed preview. tick marks and stars are saved in this browser.';
    buildFilters(); render();
  })
  .catch(function(){
    $('picks').innerHTML = '<p class="msg">couldn\'t load data.json. open this page through your site address, not as a downloaded file.</p>';
  });
</script>
</body>
</html>
